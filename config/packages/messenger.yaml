framework:
    messenger:
        failure_transport: failed

        transports:
            async:  '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync:   'sync://'

        routing:
            App\Message\SendEmailMessage:            async
            App\Message\SendSmsMessage:              async
            App\Message\SendPushNotificationMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
