services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: snapstamp_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./var:/var/www/html/var
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://snapstamp_user:snapstamp_pass@db:3306/snapstamp_db?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379

  nginx:
    image: nginx:alpine
    container_name: snapstamp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: snapstamp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: snapstamp_db
      MYSQL_USER: snapstamp_user
      MYSQL_PASSWORD: snapstamp_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: snapstamp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: snapstamp_user
      PMA_PASSWORD: snapstamp_pass
      PMA_PORT: 3306
    depends_on:
      - db
      - nginx

  redis:
    image: redis:7-alpine
    container_name: snapstamp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: snapstamp_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql_data:
  redis_data:
