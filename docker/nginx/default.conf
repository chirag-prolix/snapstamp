server {
    listen 80;
    server_name snapstamp.local api.snapstamp.local phpmyadmin.snapstamp.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name snapstamp.local;

    root /var/www/frontend;
    index index.html;

    ssl_certificate     /etc/nginx/certs/snapstamp.local.pem;
    ssl_certificate_key /etc/nginx/certs/snapstamp.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name phpmyadmin.snapstamp.local;

    ssl_certificate     /etc/nginx/certs/phpmyadmin.snapstamp.local.pem;
    ssl_certificate_key /etc/nginx/certs/phpmyadmin.snapstamp.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://phpmyadmin:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name api.snapstamp.local;
    root /var/www/html/public;

    ssl_certificate     /etc/nginx/certs/api.snapstamp.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/api.snapstamp.local+1-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
